<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIRFlow viewer</title>
</head>
<body>
  <p><a id="viewer-link" href="{{ '/' | relative_url }}">Open the AIRFlow viewer</a></p>
  <script>
    const target = new URL(document.getElementById('viewer-link').href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
